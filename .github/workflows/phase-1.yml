name: Phase 1 validation

on:
  pull_request:
    branches: [v2/integration]
  push:
    branches: [phase/01-deterministic-engine]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Boundary validation compares the PR tree with the immutable v1
          # commit. Validate the exact PR head rather than GitHub's synthetic
          # merge commit, and fetch the history needed for the comparison.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Materialize validation refs
        shell: bash
        run: |
          git fetch --no-tags origin \
            main:refs/heads/main \
            legacy/v1:refs/heads/legacy/v1
          git switch -C "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Import boundaries
        run: node tools/phase1/validate-boundaries.mjs
      - name: Generated reports are stable
        run: git diff --exit-code -- reports/phase-1
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-validation
          path: |
            dist/
            reports/phase-1/
