name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, save version, and browser }
    validations: { required: true }
  - type: textarea
    id: accessibility
    attributes: { label: Accessibility or data-loss impact }

